[build-system]
requires = [
    'setuptools',
    'wheel',
    'setuptools-gettext',
    'translate-toolkit',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'sai2-timelapse'
version = '1.0.0'
authors = [
    { name = 'cromachina' }
]
license = { file = 'LICENSE' }
description = 'Sai2-Timelapse — SAI2 绘画过程缩时录制（读画布内存，非录屏）'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'numpy',
    'opencv-python',
    'pillow',
    'pynput',
    'pywinctl',
    'pywinbox',
    'mss',
    'psutil',
    'pymemoryeditor',
    'ttkbootstrap',
]

[tool.setuptools-gettext]
source_dir = 'po'
build_dir = 'build/lib/art_timelapse/locales'

[project.optional-dependencies]
dev = [
    'pyinstaller',
]

[project.urls]
'Homepage' = 'https://github.com/cromachina/art-timelapse'

[project.scripts]
sai2-timelapse = 'art_timelapse.__main__:main'
